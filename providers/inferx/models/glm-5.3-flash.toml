# Reasoning parameters: reasoning_effort = "low" | "high" | "max"
base_model = "zhipuai/glm-5.3"
name = "GLM 5.3 Flash"

reasoning_options = [
  { type = "effort", default = "high", options = ["low", "high", "max"] },
]

[cost]
input = 0.075
output = 0.25
cache_read = 0.015

[limit]
output = 128_000
